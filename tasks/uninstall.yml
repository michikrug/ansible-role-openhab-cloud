---
- name: Check existence of openHAB Cloud systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ openhab_cloud_identifier }}.service"
  register: openhab_cloud_service_stat

- name: Uninstall openHAB Cloud systemd service and files
  when: openhab_cloud_service_stat.stat.exists | bool
  block:
    - name: Ensure openHAB Cloud systemd service is stopped
      ansible.builtin.service:
        name: "{{ openhab_cloud_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure openHAB Cloud systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ openhab_cloud_identifier }}.service"
        state: absent

    - name: Ensure openHAB Cloud container network does not exist
      when: openhab_cloud_container_network_deletion_enabled | bool
      block:
        - name: Ensure openHAB Cloud container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ openhab_cloud_container_network }}"
            state: absent
          register: openhab_cloud_network_deletion_result

        - name: Ensure openHAB Cloud container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ openhab_cloud_container_network }}
          register: openhab_cloud_network_deletion_result
          changed_when: openhab_cloud_container_network in openhab_cloud_network_deletion_result.stdout

    - name: Ensure openHAB Cloud base path does not exist
      ansible.builtin.file:
        path: "{{ openhab_cloud_base_path }}"
        state: absent
