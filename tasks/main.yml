---
- name: Perform openHAB Cloud installation tasks
  when: openhab_cloud_enabled | bool
  tags:
    - setup-all
    - setup-openhab_cloud
    - install-all
    - install-openhab_cloud
  block:
    - name: Validate openHAB Cloud configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install openHAB Cloud
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform openHAB Cloud uninstallation tasks
  when: not openhab_cloud_enabled | bool
  tags:
    - setup-all
    - setup-openhab_cloud
  block:
    - name: Uninstall openHAB Cloud
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
